<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="1508" viewBox="0 0 680 1005" role="img">
<title>ESP32 kegerator gauge wiring: gauge, buck converter, pressure sensor and temperature probes</title>
<desc>12V supply feeds gauge I and a 5V buck converter. The gauge LED lamp runs from 5V; its negative lead and gauge GND go to common ground. Buck 5V output powers the ESP32 5V pin and the pressure sensor red wire. Sensor green signal goes through a 10k resistor to GPIO34 with an 18k resistor to ground. Gauge S goes through 22 ohms to the IRLZ44N drain with a 47uF capacitor to ground, mounted in the electronics box next to the MOSFET. GPIO18 drives the gate through 220 ohms with a 10k pull-down. Two DS18B20 probes (keg and fridge air) share one 1-Wire bus: red to ESP32 3V3, yellow data to GPIO4, black to GND, with one 4.7k pull-up from data to 3V3.</desc>
